<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FTGM — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<div class="auth-wrap">
  <form class="glass auth-card" id="loginForm" autocomplete="on">
    <div class="brand-title" style="font-size:36px">FTGM</div>
    <h2 style="margin-top:6px">Welcome back</h2>
    <div class="sub">Sign in to your Super Admin or Creator account.</div>

    <label for="email">Email</label>
    <input class="input" id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
    <label for="password">Password</label>
    <input class="input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />

    <button class="btn btn-primary" id="btn" style="width:100%;margin-top:16px" type="submit">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in
    </button>

    <div class="divider"></div>
    <div class="muted text-xs" style="text-align:center">
      Student? <a href="student.html" style="color:var(--brand-2)">Open Student Panel →</a>
    </div>
  </form>
</div>

<script src="assets/ui.js"></script>
<script type="module">
  import { auth, signInWithEmailAndPassword, onAuthStateChanged, SUPER_ADMIN_UID,
           db, doc, getDoc } from "./assets/firebase.js";

  onAuthStateChanged(auth, u => { if (u) location.replace(u.uid === SUPER_ADMIN_UID ? "admin.html" : "creator.html"); });

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('btn');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return toast('Enter email and password', 'warn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span> Signing in…';
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      // Block check for creator accounts
      if (cred.user.uid !== SUPER_ADMIN_UID) {
        const snap = await getDoc(doc(db, "creators", cred.user.uid));
        if (snap.exists() && snap.data().status === "blocked") {
          toast('Your account has been blocked by admin.', 'err', 5000);
          await auth.signOut();
          btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in';
          return;
        }
      }
      toast('Welcome back!', 'ok');
      setTimeout(()=> location.replace(cred.user.uid === SUPER_ADMIN_UID ? "admin.html" : "creator.html"), 400);
    } catch (err) {
      const map = {
        'auth/invalid-credential':'Wrong email or password.',
        'auth/invalid-email':'Invalid email address.',
        'auth/user-not-found':'No account found for that email.',
        'auth/wrong-password':'Wrong password.',
        'auth/too-many-requests':'Too many attempts. Try again later.',
      };
      toast(map[err.code] || err.message, 'err', 4500);
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in';
    }
  });
</script>
</body>
</html>
